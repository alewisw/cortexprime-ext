{{#with (?? temporary value) as |effective|}}
  {{#if (ne effective ../value)}}
    {{> (concat "systems/cortexprime-ext/templates/partials/dice/d" effective ".html")
      number=effective
      type='temporary'
    }}
  {{/if}}
{{/with}}
{{#if interactive}}
  <div class="flex-col px-0">
    <button class="step-die-up btn btn-icon btn-icon-plain-cpt btn-small" data-target="{{target}}" data-key="{{key}}" type="button">
      <i class="fa fa-chevron-up"></i>
    </button>
  </div>
  <div class="flex-col px-0">
    <button class="step-die-down btn btn-icon btn-icon-plain-cpt btn-small" data-target="{{target}}" data-key="{{key}}" type="button">
      <i class="fa fa-chevron-down"></i>
    </button>
  </div>
{{/if}}
